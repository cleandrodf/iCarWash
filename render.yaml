services:
  - type: web
    name: icarwash-df
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATABASE_URL
        sync: false
